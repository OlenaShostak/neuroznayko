const CINFO={"uk": [["Хто проводить дослідження", "Олена Шостак, психолог-нейропсихолог, авторка методики (ФОП). Дослідження не проводиться від імені закладу освіти чи університету. Олена Шостак є володільцем зібраних даних і відповідає на всі запити щодо них."], ["Навіщо це дослідження", "Ми перевіряємо, наскільки точно й стабільно ігрові завдання вимірюють те, як дитина вчиться (пам'ять, увагу, самоконтроль, сприйняття звуків і кількостей), і те, що вона вже знає (букви, слова, лічбу). За результатами буде створено вікові орієнтири для українських дітей."], ["Що робитиме дитина", "Гратиме на телефоні або планшеті у дві частини, приблизно по 25 хвилин, із хвилинною розминкою посередині кожної. Частини можна пройти в різні дні, але не довше ніж за тиждень. Завдання пояснює казковий персонаж — Мудра Сова. Через 7 днів гру потрібно пройти вдруге: так ми перевіряємо, чи стабільні результати."], ["Що робитимете ви", "Заповните анкету про повсякденне життя дитини й після кожної частини дасте відповідь на два питання про те, як минула гра. Під час гри просимо не підказувати дитині, а між першим і другим проходженням — не тренувати подібні завдання. За бажанням ви можете передати вихователю дитини посилання на коротку анкету педагога."], ["Які дані ми збираємо", "Відповіді дитини в завданнях і час відповіді; вік у місяцях і стать; мову проходження; тип пристрою й розмір екрана; ваші відповіді в анкеті. В анкеті є питання про сон, мовлення, перевірку зору й слуху та відвідування логопеда. Ми не збираємо ім'я, прізвище, дату народження, адресу, фото, голос чи відео дитини."], ["Де зберігаються дані й хто їх бачить", "Ім'я та дата народження зберігаються лише у вашому браузері й нікуди не надсилаються. Решта даних надходить під кодом учасника до захищеної таблиці дослідниці в сервісі Google; сервери сервісу можуть бути за межами України. Доступ до таблиці має лише Олена Шостак. У публікаціях наводяться тільки узагальнені результати груп."], ["Скільки зберігаються дані", "5 років після завершення дослідження, після чого таблицю буде видалено."], ["Ризики й незручності", "Дитина може втомитися або засмутитися, якщо завдання не виходить. Гра не ставить дитині оцінок і не підраховує при ній помилки, а будь-яку частину можна перервати. Інших ризиків дослідження не передбачає."], ["Що ви отримаєте", "Одразу після гри — звіт «Профіль готовності до школи», після повторного проходження — доступ до банку розвивальних ігор. Участь безоплатна й не оплачується. Звіт не є діагнозом і не містить висновку про готовність до школи, бо вікових норм для тесту ще немає."], ["Добровільність", "Ви можете відмовитися від участі будь-коли й без пояснень. Щоб видалити вже надіслані дані, напишіть на {mail} або в {msg} і вкажіть код учасника: він показаний на головному екрані гри та в звіті."], ["Згода дитини", "На початку кожної частини Сова запитує дитину, чи хоче вона грати. Якщо дитина відмовляється, гра не починається. Просимо не вмовляти її й повернутися до гри іншим разом."], ["Контакти", "Олена Шостак, {mail}, {msg}."]], "ru": [["Кто проводит исследование", "Елена Шостак, психолог-нейропсихолог, автор методики (ФЛП). Исследование не проводится от имени учебного заведения или университета. Елена Шостак является владельцем собранных данных и отвечает на все запросы о них."], ["Зачем это исследование", "Мы проверяем, насколько точно и стабильно игровые задания измеряют то, как ребёнок учится (память, внимание, самоконтроль, восприятие звуков и количеств), и то, что он уже знает (буквы, слова, счёт). По результатам будут созданы возрастные ориентиры для украинских детей."], ["Что будет делать ребёнок", "Играть на телефоне или планшете в две части, примерно по 25 минут, с минутной разминкой в середине каждой. Части можно пройти в разные дни, но не дольше чем за неделю. Задания объясняет сказочный персонаж — Мудрая Сова. Через 7 дней игру нужно пройти повторно: так мы проверяем, стабильны ли результаты."], ["Что будете делать вы", "Заполните анкету о повседневной жизни ребёнка и после каждой части ответите на два вопроса о том, как прошла игра. Во время игры просим не подсказывать ребёнку, а между первым и вторым прохождением — не тренировать похожие задания. По желанию вы можете передать воспитателю ребёнка ссылку на короткую анкету педагога."], ["Какие данные мы собираем", "Ответы ребёнка в заданиях и время ответа; возраст в месяцах и пол; язык прохождения; тип устройства и размер экрана; ваши ответы в анкете. В анкете есть вопросы о сне, речи, проверке зрения и слуха и посещении логопеда. Мы не собираем имя, фамилию, дату рождения, адрес, фото, голос или видео ребёнка."], ["Где хранятся данные и кто их видит", "Имя и дата рождения хранятся только в вашем браузере и никуда не отправляются. Остальные данные поступают под кодом участника в защищённую таблицу исследователя в сервисе Google; серверы сервиса могут находиться за пределами Украины. Доступ к таблице есть только у Елены Шостак. В публикациях приводятся только обобщённые результаты групп."], ["Сколько хранятся данные", "5 лет после завершения исследования, после чего таблица будет удалена."], ["Риски и неудобства", "Ребёнок может устать или расстроиться, если задание не получается. Игра не ставит ребёнку оценок и не подсчитывает при нём ошибки, а любую часть можно прервать. Других рисков исследование не предполагает."], ["Что вы получите", "Сразу после игры — отчёт «Профиль готовности к школе», после повторного прохождения — доступ к банку развивающих игр. Участие бесплатное и не оплачивается. Отчёт не является диагнозом и не содержит вывода о готовности к школе, потому что возрастных норм для теста ещё нет."], ["Добровольность", "Вы можете отказаться от участия в любой момент и без объяснений. Чтобы удалить уже отправленные данные, напишите на {mail} или в {msg} и укажите код участника: он показан на главном экране игры и в отчёте."], ["Согласие ребёнка", "В начале каждой части Сова спрашивает ребёнка, хочет ли он играть. Если ребёнок отказывается, игра не начинается. Просим не уговаривать его и вернуться к игре в другой раз."], ["Контакты", "Елена Шостак, {mail}, {msg}."]]};

function _hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function _seeded(seedStr){let a=_hash(seedStr);return function(){a|=0;a=a+0x6D2B79F5|0;let x=Math.imul(a^a>>>15,1|a);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296;};}
/* n кіл радіуса r у полі 100×100 без накладань; розташування залежить лише від seed */
function scatter(seed,n,r,o){o=o||{};const pad=(o.pad==null?6:o.pad)+r;let gap=o.gap==null?3:o.gap;const rnd=_seeded(seed);let pts=[],tries=0;
  while(pts.length<n){ if(++tries>5000){tries=0;pts=[];gap=Math.max(0.4,gap-0.4);}
    const x=pad+rnd()*(100-2*pad), y=pad+rnd()*(100-2*pad);
    if(pts.every(p=>Math.hypot(p[0]-x,p[1]-y)>=2*r+gap)) pts.push([+x.toFixed(1),+y.toFixed(1)]); }
  return pts;}

function c2Dots(form,i,nL,nR,area){ const big=Math.max(nL,nR), small=Math.min(nL,nR);
  let rSmallSet=5.2, rBigSet=5.2;                               /* «за»: крапки однакові, тож більша група має й більшу площу */
  if(area==="against"){ rSmallSet=6.4; rBigSet=+(6.4*Math.sqrt(0.75*small/big)).toFixed(2); }   /* «проти»: площа більшої групи = 75 % площі меншої */
  const rL=nL>nR?rBigSet:rSmallSet, rR=nR>nL?rBigSet:rSmallSet;
  return {L:dotsSVG(scatter("C2|"+form+"|"+i+"|L",nL,rL,{pad:5,gap:2.5}),rL), R:dotsSVG(scatter("C2|"+form+"|"+i+"|R",nR,rR,{pad:5,gap:2.5}),rR), rL, rR,
    area_ratio:+((big*Math.PI*rBigSet*rBigSet)/(small*Math.PI*rSmallSet*rSmallSet)).toFixed(2)}; }

function nlView(target){ view(`<div class="stim sm" id="tg">${target==null?"":`<span class="digit">${target}</span>`}</div>
    <div class="nl" id="nl"><div class="bar"></div><div class="end" id="e0" style="left:0">0</div><div class="end" id="e10" style="left:100%">10</div></div>
    <div class="center"><button class="btn ok" id="done" disabled>${u("ready")} ✓</button></div>`);
  const nl=$("#nl"); S.line_px=Math.round(nl.getBoundingClientRect().width); return nl; }
function nlMark(nl,pos,cls){ let m=nl.querySelector("."+(cls||"mk")); if(!m){ m=document.createElement("div"); m.className=cls||"mk"; if(!cls) m.innerHTML=`<img src="${BUNNY_IMG}" alt="" draggable="false">`; nl.appendChild(m); } m.style.left=(pos*10)+"%"; return m; }
/* Дитина ставить зайчика (торкання або перетягування), може поправити, потім «Готово» */
function nlAsk(nl){ return new Promise(res=>{ const done=$("#done"); let pos=null,moves=0,down=false; const t0=performance.now(); const tm=idle(()=>res({timeout:1,pos}));
    const at=e=>{ const b=nl.getBoundingClientRect(); return Math.max(0,Math.min(10,+(((e.clientX-b.left)/b.width)*10).toFixed(1))); };
    const set=e=>{ if(tm.done) return; tm.poke(); pos=at(e); nlMark(nl,pos); done.disabled=false; };
    nl.onpointerdown=e=>{ down=true; moves++; try{nl.setPointerCapture(e.pointerId);}catch(_){} set(e); };
    nl.onpointermove=e=>{ if(down) set(e); };
    nl.onpointerup=nl.onpointercancel=()=>{ down=false; };
    done.onclick=()=>{ if(tm.done||pos==null) return; tm.stop(); res({pos,moves,rt:Math.round(performance.now()-t0)}); }; }); }
async function runC5(){ const SUB="C5", seq=C5_SEQ[S.form];
  /* орієнтування: Сова показує 0 і 10 */
  setRepeat(null); takeRepeats();
  let nl=nlView(null); $("#done").style.visibility="hidden"; $("#tg").style.visibility="hidden";
  await say(sy("c5_a")); $("#e0").classList.add("hl"); await say(sy("c5_b")); await wait(350); $("#e0").classList.remove("hl");
  $("#e10").classList.add("hl"); await say(sy("c5_c")); await wait(350); $("#e10").classList.remove("hl");
  /* дві навчальні проби зі зворотним зв'язком: 0 і 10 */
  for(const [target,ask,fb] of [[0,"c5_t0","c5_f0"],[10,"c5_t10","c5_f10"]]){
    nl=nlView(target); await sayParts(sy(ask)); setRepeat(()=>sayParts(sy(ask)),1);
    const r=await nlAsk(nl); setRepeat(null);
    const row=r.timeout? rec(SUB,{item:"T"+target,ttype:"train",stim:target,timeout:1,rt_ms:CFG.TIMEOUT_MS})
                       : rec(SUB,{item:"T"+target,ttype:"train",stim:target,resp:r.pos,pos_x:r.pos,err:+Math.abs(r.pos-target).toFixed(1),correct:Math.abs(r.pos-target)<=0.8?1:0,rt_ms:r.rt,moves:r.moves});
    nlMark(nl,target); nlMark(nl,target,"tick"); $(target===0?"#e0":"#e10").classList.add("hl"); await say(sy(fb)); await wait(500); await after(row);
  }
  /* шість залікових чисел: без зворотного зв'язку і без правила зупинки */
  for(let i=0;i<seq.length;i++){ const n=seq[i]; const parts=[sy("c5_q")(n),sy("c5_put")];
    nl=nlView(n); setProg(i/seq.length); await sayParts(parts); setRepeat(()=>sayParts(parts),1);
    const r=await nlAsk(nl); setRepeat(null);
    const row=r.timeout? rec(SUB,{item:String(i+1),stim:n,timeout:1,correct:0,rt_ms:CFG.TIMEOUT_MS,pos_x:r.pos})
      : rec(SUB,{item:String(i+1),stim:n,resp:r.pos,pos_x:r.pos,err:+Math.abs(r.pos-n).toFixed(1),pae:+(Math.abs(r.pos-n)*10).toFixed(1),correct:Math.abs(r.pos-n)<=C5_HIT?1:0,rt_ms:r.rt,moves:r.moves,line_px:S.line_px});
    await wait(300); await after(row);
  } }

const A1_LENS=[2,3,4,5,6], A1_HOP=550;
async function runA1(){ const SUB="A1", total=A1_LENS.length*2; let stop=false, n=0;
  await instruct(SUB,sy("a1_i"));

          d.onpointerdown=()=>{ if(tm.done||input.length>=seq.length) return; input.push(+d.dataset.i); d.classList.add("tap"); setTimeout(()=>d.classList.remove("tap"),200);

/* ---------- A2 «Злови метелика» ---------- */
const A2_GO="butterfly", A2_NOGO=["bird","beetle","wasp","daisy","mushroom"], A2_N=32, A2_NG=8, A2_DUR=1200, A2_ISI=450;

function a2Seq(form){ const r=_seeded("A2|"+form); let pos;
  for(let t=0;t<500;t++){ const c=[...Array(A2_N-2).keys()].map(i=>i+2); for(let i=c.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[c[i],c[j]]=[c[j],c[i]];}
    pos=new Set(c.slice(0,A2_NG)); if(![...pos].some(p=>pos.has(p+1))) break; }
  const off=Math.floor(r()*A2_NOGO.length); let k=0;
  return [...Array(A2_N).keys()].map(i=>pos.has(i)?A2_NOGO[(off+k++)%A2_NOGO.length]:A2_GO); }
async function runA2(){ const SUB="A2", seq=a2Seq(S.form), dur=FAST?300:A2_DUR, isi=FAST?40:A2_ISI, sleep=ms=>new Promise(r=>setTimeout(r,ms));
  await Promise.all([preload([A2_GO].concat(A2_NOGO)),instruct(SUB,sy("a2_i"),`<div class="demo"><div class="optc pic ok">${picK(A2_GO)}</div><div class="optc pic no">${picK("beetle")}</div></div>`)]);

    gs.onpointerdown=()=>{ if(rt==null){ rt=Math.round(performance.now()-t0); gs.classList.add("pick"); } };
    await sleep(dur); gs.onpointerdown=null; gs.innerHTML=""; gs.classList.remove("pick"); delete gs.dataset.go;
    rec(SUB,{item:String(i+1),ttype:"score",stim,go:go?1:0,resp:rt!=null?1:0,correct:(go?rt!=null:rt==null)?1:0,rt_ms:rt});

const DCCS_SHAPES={circle:"M50 50 m-32 0 a32 32 0 1 0 64 0 a32 32 0 1 0 -64 0",square:"M22 22 h56 v56 h-56 Z",star:"M50 14 L60 40 L88 40 L64 58 L74 86 L50 68 L26 86 L36 58 L12 40 L40 40 Z",triangle:"M50 16 L86 82 L14 82 Z"};

/* зірочок по дві в кожному рядку; розташування однакове для всіх дітей із тією самою формою */

/* ===================== БЛОК E: ЗОРОВО-МОТОРНА КООРДИНАЦІЯ ===================== */
/* ---------- E1 «Доріжка пальчиком» ---------- */
/* точки в частках поля: u — уздовж руху, v — упоперек; w — ширина коридору як частка короткої сторони екрана */
const E1_PATHS=[{id:"straight",w:0.12,pts:[[.08,.5],[.92,.5]]},
  {id:"wavy",w:0.10,pts:Array.from({length:61},(_,k)=>{const t=k/60;return [.08+.84*t,.5+.2*Math.sin(2*Math.PI*1.5*t)];})},
  {id:"zigzag",w:0.08,pts:[[.08,.5],[.25,.27],[.42,.73],[.58,.27],[.75,.73],[.92,.5]]}];
const E1_OK=0.9;                                    /* попередній поріг: частка шляху в коридорі */

const _dPath=(p,P)=>{ let m=1e9; for(let i=1;i<P.length;i++) m=Math.min(m,_dSeg(p,P[i-1],P[i])); return m; };
const CARROT=(x,y,s)=>`<g transform="translate(${x} ${y}) scale(${s/40})"><path d="M-9 -8q9 -6 18 0q-2 20 -9 30q-7 -10 -9 -30z" fill="#e8873a" stroke="#8a4a1a" stroke-width="2" stroke-linejoin="round"/><path d="M-4 -9q-6 -9 -2 -14q4 4 4 12M0 -10q0 -10 4 -14q3 6 0 14M4 -9q6 -8 9 -6q-2 6 -8 8" fill="#6fa55b" stroke="#3f6a35" stroke-width="1.6" stroke-linejoin="round"/></g>`;
async function e1Path(def,idx){ const SUB="E1";
  view(`<div class="e1" id="fld"><svg id="e1s"></svg><div class="e1b" id="bn"><img src="${BUNNY_IMG}" alt="" draggable="false"></div></div>`);
  const fld=$("#fld"), bn=$("#bn"), R=fld.getBoundingClientRect(), W=R.width, H=R.height, port=H>W, flip=S.form==="B";

async function runE1(){ const SUB="E1";

const e2Line=(a,b,cls)=>{ const g=$("#e2l"); if(g) g.insertAdjacentHTML("beforeend",`<path class="${cls||""}" d="M${6+a[0]*10} ${6+a[1]*10}L${6+b[0]*10} ${6+b[1]*10}" stroke="${cls==="ghost"?"#7bab7e":"#2b2b2b"}" stroke-width="1.5" stroke-linecap="round" fill="none"/>`); };

async function runE2(){ const SUB="E2", pats=E2_PAT[S.form];
  await instruct(SUB,sy("e2_i"));
  /* показ напрямків і дві навчальні проби */
  setRepeat(null); e2Field(); let cur=[4,3]; e2Cur(cur); await wait(300);

    const r=await e2Tap(cur); setRepeat(null); const ok=!!r&&r.p[0]===want[0]&&r.p[1]===want[1];
    const row=rec(SUB,{item:"T"+(i+1),ttype:"train",stim:st,resp:r?(r.p[0]-cur[0])+","+(r.p[1]-cur[1]):"",correct:ok?1:0,rt_ms:r?r.rt:CFG.TIMEOUT_MS,timeout:r?0:1});
    if(r&&!ok) e2Line(cur,r.p); e2Line(cur,want,ok?"":"ghost"); await say(sy(ok?"b_yes":"e2_fix")); await wait(400); await after(row); }
  for(let p=0;p<pats.length;p++){ const pat=pats[p], up=pat[0][0]==="U"; e2Field(); cur=[0,up?4:1]; e2Cur(cur); setProg(p/pats.length);
    await say(sy(p?"e2_new":"e2_start")); let dead=false;
    for(let k=0;k<E2_DICT+E2_CONT;k++){ const st=pat[k%pat.length], v=e2Vec(st), want=[cur[0]+v[0],cur[1]+v[1]], phase=k<E2_DICT?"dict":"cont";
      const base={item:"P"+(p+1)+"-"+(k+1),ttype:"score",stim:st,pattern:p+1,phase,from:cur.join(",")};
      if(dead||want[0]<0||want[1]<0||want[0]>=E2_COLS||want[1]>=E2_ROWS){ dead=true; recSkipped(SUB,base); continue; }      /* вийшли за поле: далі крок неможливий */
      if(k===E2_DICT){ await say(sy("e2_cont")); setRepeat(()=>say(sy("e2_cont")),1); }
      if(phase==="dict"){ const ph=sy("e2_s")[st]; await say(ph); setRepeat(()=>say(ph),1); }
      const r=await e2Tap(cur); if(phase==="dict") setRepeat(null);
      const row=r? rec(SUB,Object.assign(base,{resp:(r.p[0]-cur[0])+","+(r.p[1]-cur[1]),correct:(r.p[0]===want[0]&&r.p[1]===want[1])?1:0,rt_ms:r.rt}))
                 : rec(SUB,Object.assign(base,{timeout:1,correct:0,rt_ms:CFG.TIMEOUT_MS}));
      if(r){ e2Line(cur,r.p); cur=r.p; e2Cur(cur); }
      await after(row); if(!$("#e2s")){ e2Field(); e2Cur(cur); }
    }
    setRepeat(null); await wait(500); } }

/* ---------- F2 «Вибери завдання» (експериментальний) ---------- */
/* елемент: [форма, колір, масштаб]; opts[cpos] — правильна відповідь */
const RID={
 e1:{seq:[["circle","red"],["square","blue"],["circle","red"],["square","blue"],["circle","red"]],opts:[["circle","red"],["square","blue"],["triangle","green"]],c:1},
 e2:{seq:[["triangle","green"],["triangle","green"],["star","yellow"],["triangle","green"],["triangle","green"]],opts:[["star","yellow"],["triangle","green"],["circle","red"]],c:0},
 e3:{seq:[["star","yellow"],["circle","red"],["star","yellow"],["circle","red"],["star","yellow"]],opts:[["square","blue"],["star","yellow"],["circle","red"]],c:2},
 h1:{seq:[["circle","red"],["square","blue"],["circle","yellow"],["square","red"],["circle","blue"],["square","yellow"]],opts:[["square","red"],["circle","blue"],["circle","red"],["square","yellow"]],c:2},
 h2:{seq:[["triangle","green",.45],["triangle","orange",.7],["triangle","green",1],["triangle","orange",.45],["triangle","green",.7]],opts:[["triangle","green",1],["triangle","orange",1],["triangle","orange",.7],["triangle","orange",.45]],c:1}};
const F2_PLAN={A:[{hard:"h1",easy:"e1",hp:1},{hard:"h2",easy:"e2",hp:0}],B:[{hard:"h2",easy:"e2",hp:0},{hard:"h1",easy:"e1",hp:1}]};
const F2_MAX_TRIES=3, F2_MS=60000;
const ridEl=e=>`<svg viewBox="0 0 100 100"><g transform="translate(50 50) scale(${e[2]||0.9}) translate(-50 -50)"><path d="${DCCS_SHAPES[e[0]]}" fill="${DCCS_COL[e[1]]}" fill-opacity="0.92" stroke="#2b2b2b" stroke-width="3" stroke-linejoin="round"/></g></svg>`;
const stars=n=>`<svg viewBox="0 0 108 40">${Array.from({length:n},(_,i)=>`<path transform="translate(${54-n*17+i*34} 3) scale(.34)" d="M50 8 L61 38 L93 38 L67 57 L77 90 L50 70 L23 90 L33 57 L7 38 L39 38 Z" fill="#f0c94a" stroke="#8a6a1a" stroke-width="5" stroke-linejoin="round"/>`).join("")}</svg>`;
function ridView(R,hard){ view(`<div class="rseq">${R.seq.map(e=>`<div>${ridEl(e)}</div>`).join("")}<div class="rq">?</div></div>
    <div class="opts c${R.opts.length}" id="ro">${R.opts.map((e,j)=>`<button class="optc" data-i="${j}" disabled>${ridEl(e)}</button>`).join("")}</div>
    ${hard?`<div class="center"><button class="ghost hand" id="hand" disabled>✋</button></div>`:""}`); }
/* очікування відповіді: картка, «долонька» або вичерпаний час */
function ridWait(ms){ return new Promise(res=>{ const t0=performance.now(); const h=setTimeout(()=>res({timeout:1}),ms);
    $$("#ro .optc").forEach(b=>{ b.disabled=false; b.classList.remove("pick"); b.onpointerdown=()=>{ clearTimeout(h); b.classList.add("pick"); $$("#ro .optc").forEach(x=>x.disabled=true); res({i:+b.dataset.i,rt:Math.round(performance.now()-t0)}); }; });
    const hd=$("#hand"); if(hd){ hd.disabled=false; hd.onclick=()=>{ clearTimeout(h); res({quit:1,rt:Math.round(performance.now()-t0)}); }; } }); }
async function runF2(){ const SUB="F2", plan=F2_PLAN[S.form], budget=FAST?4000:F2_MS; let handSaid=false;
  await instruct(SUB,sy("f2_i"),`<div class="demo"><div class="optc">${stars(1)}</div><div class="optc">${stars(3)}</div></div>`);
  for(let rd=0;rd<plan.length;rd++){ const P=plan[rd]; setRepeat(null); setProg(rd/3);
    /* вибір: легка (одна зірочка) чи складна (три) */
    view(`<div class="opts c2">${[0,1].map(j=>`<button class="optc" data-i="${j}" disabled>${stars(j===P.hp?3:1)}</button>`).join("")}</div>`);
    await wait(300); const ch=await pickCard([{t:sy("f2_choose")}]); const hard=!ch.timeout&&ch.i===P.hp;
    rec(SUB,{item:"R"+(rd+1),ttype:"choice",stim:P.hard+"|"+P.easy,resp:ch.timeout?"":(hard?"hard":"easy"),pos:ch.timeout?null:ch.i,hard_pos:P.hp,timeout:ch.timeout?1:0,rt_ms:ch.timeout?CFG.TIMEOUT_MS:ch.rt,correct:null});
    const key=hard?P.hard:P.easy, R=RID[key]; ridView(R,hard); await wait(300); await say(sy(hard&&!handSaid?"f2_q_hand":"f2_q")); if(hard) handSaid=true;
    const tStart=performance.now(); let tries=0, solved=0, quit=0;
    for(;;){ const left=hard?budget-(performance.now()-tStart):CFG.TIMEOUT_MS; if(left<=0) break;
      const r=await ridWait(left); if(r.timeout) { rec(SUB,{item:"R"+(rd+1)+"-to",ttype:"attempt",kind:hard?"hard":"easy",riddle:key,timeout:1,correct:null,rt_ms:Math.round(performance.now()-tStart)}); break; }
      if(r.quit){ quit=1; rec(SUB,{item:"R"+(rd+1)+"-quit",ttype:"quit",kind:"hard",riddle:key,tries,rt_ms:Math.round(performance.now()-tStart),correct:null}); break; }
      tries++; const ok=r.i===R.c; rec(SUB,{item:"R"+(rd+1)+"-"+tries,ttype:"attempt",kind:hard?"hard":"easy",riddle:key,try_n:tries,resp:r.i,pos:r.i,cpos:R.c,correct:ok?1:0,rt_ms:r.rt});
      if(ok){ solved=1; break; } if(!hard||tries>=F2_MAX_TRIES) break;
      /* виняток із правила «без зворотного зв'язку»: Сова питає, чи пробувати ще */
      const hd=$("#hand"); if(hd) hd.style.visibility="hidden";
      $("#ro").insertAdjacentHTML("afterend",`<div class="center" id="rr"><button class="btn" id="again">🔁</button><button class="ghost hand" id="stop">✋</button></div>`);
      await say(sy("f2_retry")); const go=await new Promise(res=>{ const h=setTimeout(()=>res(null),Math.max(500,budget-(performance.now()-tStart))); $("#again").onclick=()=>{clearTimeout(h);res(1);}; $("#stop").onclick=()=>{clearTimeout(h);res(0);}; });
      const rr=$("#rr"); if(rr) rr.remove(); if(hd) hd.style.visibility="";
      if(!go){ quit=1; rec(SUB,{item:"R"+(rd+1)+"-quit",ttype:"quit",kind:"hard",riddle:key,tries,after_error:1,timeout:go===null?1:0,rt_ms:Math.round(performance.now()-tStart),correct:null}); break; }
    }
    await wait(300); if(hard&&!solved) await say(sy("f2_next")); await wait(250); }
  /* завершення: легка загадка, яку дитина обов'язково розв'язує */
  setProg(2/3); const R=RID.e3; ridView(R,false); await wait(300); await say(sy("f2_last")); let n=0;
  for(;;){ const r=await ridWait(CFG.TIMEOUT_MS); if(r.timeout){ rec(SUB,{item:"F-to",ttype:"final",riddle:"e3",timeout:1,correct:null,rt_ms:CFG.TIMEOUT_MS}); break; }
    n++; const ok=r.i===R.c; rec(SUB,{item:"F-"+n,ttype:"final",riddle:"e3",try_n:n,resp:r.i,pos:r.i,cpos:R.c,correct:ok?1:0,rt_ms:r.rt});
    if(ok){ $(`#ro .optc[data-i="${R.c}"]`).classList.add("good"); await say(sy("f2_bravo")); break; }
    if(n>=2){ $(`#ro .optc[data-i="${R.c}"]`).classList.add("good"); await say(sy("f2_hint2")); } else await say(sy("f2_hint1")); }
  await wait(400); }

  $("#hb").onclick=hub; $("#dj").onclick=dlJSON; $("#dc").onclick=dlCSV; }
function download(name,text,type){const b=new Blob([text],{type});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;a.click();}
function dlJSON(){download(S.session+".json",JSON.stringify({session:flatSession(),trials:S.trials,events:S.events},null,1),"application/json");}
function dlCSV(){const keys=[];S.trials.forEach(r=>Object.keys(r).forEach(k=>{if(!keys.includes(k))keys.push(k);}));
  const cell=v=>v==null?"":String(v).replace(/;/g,",");download(S.session+"_trials.csv","﻿"+keys.join(";")+"\n"+S.trials.map(r=>keys.map(k=>cell(r[k])).join(";")).join("\n"),"text/csv;charset=utf-8");}

function allPhrases(l){ const keep=lang; lang=l; const out=new Set(); const add=x=>[x].flat().forEach(s=>s&&out.add(String(s).replace(/\s+/g," ").trim()));
  const Y=SAY[l]; const walk=v=>{ if(typeof v==="function"||v==null) return; if(typeof v==="object"&&!Array.isArray(v)) Object.values(v).forEach(walk); else if(Array.isArray(v)) v.forEach(walk); else add(v); };
  walk(Y);
  for(const f of ["A","B"]){ C3_SEQ[f].forEach(n=>add(Y.c3_t(n==="K"?2:n))); C5_SEQ[f].forEach(n=>add(Y.c5_q(n))); }
  for(const f of ["A","B"]) D1_SEQ[f].forEach(q=>add(d1Phrase(q,l))); add(d1Phrase(D1_TRAIN,l));
  if(Y.b4_t){ for(const f of ["A","B"]){ B4_SEQ[f].forEach((t,i)=>add(Y.b4_t(b4Ph(f,i,l)))); B5_L[l][f].forEach(t=>add(t[1]?Y.b5_c(t[1]):Y.b5_v(t[0])));
      for(const sb of ["B1","B2"]) PH_L[l][sb][f].concat(PH_L[l][sb].T).forEach(x=>{const t=phTrial(x);add(t.sample);add(t.ans);t.d.forEach(d=>add(d.w));}); B3_L[l][f].forEach(add); } }
  lang=keep; const o={}; [...out].forEach(s=>o[voiceKey(s)]=s); return o; }
