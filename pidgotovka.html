<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>НейроЗнайко · Підготовка до школи</title>
<style>
  :root{--bg1:#3b4a6b;--bg2:#4a4a6a;--ink:#2b2b2b;--paper:#f4f2ec;--accent:#d8c48a;--good:#7bab7e;--see:#8a92b8;--warn:#c98a5a;--card:#fff}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif}
  body{background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;color:var(--ink)}
  #app{max-width:760px;margin:0 auto;padding:18px 14px 90px}
  .screen{animation:pop .25s ease}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h1{color:#fff;font-size:clamp(24px,5.6vw,34px);margin:.2em 0;text-align:center}
  h2{color:#fff;font-size:clamp(19px,4.2vw,25px);margin:.4em 0 .3em}
  p.lead{color:#fff;font-size:clamp(15px,3.2vw,18px);line-height:1.5;opacity:.95;text-align:center}
  p.sub{color:#fff;opacity:.75;font-size:14px;margin:0 0 8px}
  button{font-family:inherit;cursor:pointer}
  .btn{border:0;border-radius:18px;padding:13px 24px;margin:6px 4px;font-size:clamp(16px,3.4vw,19px);font-weight:700;color:var(--ink);background:var(--accent);box-shadow:0 4px 0 #b09c62,0 7px 14px rgba(0,0,0,.22)}
  .btn:active{transform:translateY(2px);box-shadow:0 2px 0 #b09c62}
  .btn.ok{background:var(--good);color:#fff;box-shadow:0 4px 0 #557e58,0 7px 14px rgba(0,0,0,.22)}
  .btn.sec{background:#fff;color:#3b4a9c;box-shadow:0 4px 0 #c9cde6}
  .btn.small{font-size:14.5px;padding:9px 14px;border-radius:14px}
  .ghost{background:rgba(255,255,255,.14);color:#fff;border:2px solid rgba(255,255,255,.45);font-size:15px;padding:9px 16px;border-radius:18px;font-weight:700;margin:4px}
  .hero{width:150px;height:150px;margin:6px auto 0;filter:drop-shadow(0 6px 12px rgba(0,0,0,.3))} .hero img{width:100%;height:100%;object-fit:contain;border-radius:50%}
  .hero.sm{width:72px;height:72px;margin:0}
  .center{text-align:center}
  .form{background:rgba(255,255,255,.97);border-radius:18px;padding:18px;margin:10px 0;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  .form h3{margin:0 0 6px;color:#2b3a8c} .form p{font-size:14.5px;line-height:1.5;margin:6px 0}
  .form label.l{display:block;margin:14px 0 6px;font-weight:700;font-size:15px}
  input[type=text],input[type=date]{width:100%;padding:10px;border:1.5px solid #bbb;border-radius:10px;font-size:16px;font-family:inherit}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{border:1.5px solid #bbb;border-radius:18px;padding:8px 13px;font-size:14.5px;background:#fff}
  .chip.sel{background:var(--see);color:#fff;border-color:var(--see)}
  .note{background:#fff7e6;border:1px solid #e3c98a;border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.45;color:#5a4a1e;margin:10px 0}
  .info{background:#eef0fa;border-left:4px solid #6f7fd6;border-radius:8px;padding:9px 12px;font-size:13.5px;line-height:1.45;margin:10px 0}
  .ptab{width:100%;border-collapse:collapse;font-size:13.5px;margin:6px 0} .ptab td{padding:4px 6px;border-bottom:1px solid #e3e6f3} .ptab td:last-child{text-align:right;white-space:nowrap;color:#5d6594}
  .card{background:var(--card);border-radius:16px;padding:14px 16px;margin:10px 0;box-shadow:0 6px 18px rgba(0,0,0,.2);display:flex;gap:12px;align-items:center;text-align:left}
  .card.click{cursor:pointer} .card .ic{font-size:30px;width:46px;text-align:center;flex:none}
  .card .tt{font-weight:800;font-size:17px;color:#1f2440} .card .mm{font-size:13px;color:#5d6594;margin-top:2px}
  .card .st{margin-left:auto;font-size:22px;flex:none}
  .card.done{background:#eef7ee} .card.skip{background:#f6f1e8}
  .star{color:#c9a227;font-size:14px}
  .act{background:#fff;border-radius:18px;padding:18px;box-shadow:0 8px 24px rgba(0,0,0,.25);text-align:left}
  .act h2{color:#1f2440;margin:0 0 4px} .act .mod{color:#5d6594;font-size:14px;font-weight:700}
  .act ol{padding-left:22px;margin:8px 0} .act li{margin:7px 0;line-height:1.5;font-size:15.5px}
  .act .why{background:#eef0fa;border-radius:10px;padding:9px 12px;font-size:14px;color:#2b3a8c;margin:10px 0}
  .act .var{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0} .act .var div{background:#f6f6f2;border-radius:10px;padding:8px 10px;font-size:13.5px;line-height:1.4} .act .var b{display:block;font-size:12.5px;color:#5d6594;margin-bottom:2px}
  @media(max-width:520px){.act .var{grid-template-columns:1fr}}
  .act .mat{font-size:14px;margin:6px 0} .act .pdfl{display:inline-block;margin-top:4px;color:#3b4a9c;font-weight:700}
  .row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px}
  .nav{position:fixed;left:0;right:0;bottom:0;background:rgba(30,34,64,.96);display:flex;justify-content:center;gap:2px;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
  .nav button{background:none;border:0;color:#cfd4ee;font-size:11.5px;font-weight:700;padding:4px 8px;border-radius:10px;min-width:64px}
  .nav button span{display:block;font-size:21px} .nav button.on{color:#fff;background:rgba(255,255,255,.12)}
  .wk{background:#fff;border-radius:14px;padding:10px 12px;margin:8px 0;box-shadow:0 4px 12px rgba(0,0,0,.18)}
  .wk h4{margin:0 0 6px;color:#2b3a8c} .wk .d{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-top:1px solid #eef0fa;font-size:14px} .wk .d:first-of-type{border-top:0}
  .wk .d .dn{width:52px;font-weight:800;color:#5d6594;flex:none} .wk .d .a{flex:1;cursor:pointer} .wk .d .a:hover{text-decoration:underline}
  .wk.cur{outline:3px solid var(--accent)}
  .bar{height:10px;background:#e3e6f3;border-radius:6px;overflow:hidden} .bar i{display:block;height:100%;background:var(--good)}
  .mrow{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:14px} .mrow .nm{width:180px} .mrow .bar{flex:1}
  .lang{position:absolute;top:10px;right:12px}
  .muted{color:#fff;opacity:.7;font-size:13px;text-align:center;margin-top:16px}
  @media print{.nav,.noprint{display:none!important} body{background:#fff}}
</style>
</head>

о делать с лишним?"}, "why": {"uk": "Перші уявлення про ділення й рівність.", "ru": "Первые представления о делении и равенстве."}, "pdf": null}, {"id": "measure", "m": "m2", "core": false, "age": 6, "t": {"uk": "Міряємо долонями", "ru": "Меряем ладошками"}, "mat": {"uk": "нічого не потрібно", "ru": "ничего не нужно"}, "steps": {"uk": ["Виміряйте долонями довжину столу: дитина прикладає долоню за долонею й рахує.", "Тепер виміряйте той самий стіл своїми долонями. Чому вийшло інше число?", "Виміряйте кроками кімнату, коридор.", "Запишіть результати й порівняйте: що довше?"], "ru": ["Измерьте ладошками длину стола: ребёнок прикладывает ладонь за ладонью и считает.", "Теперь измерьте тот же стол своими ладонями. Почему получилось другое число?", "Измерьте шагами комнату, коридор.", "Запишите результаты и сравните: что длиннее?"]}, "easy": {"uk": "Короткі предмети: подушка, рушник.", "ru": "Короткие предметы: подушка, полотенце."}, "hard": {"uk": "Вгадати заздалегідь, скільки долонь вийде.", "ru": "Угадать заранее, сколько ладошек получится."}, "why": {"uk": "Лічба в дії й перше знайомство з вимірюванням.", "ru": "Счёт в действии и первое знакомство с измерением."}, "pdf": null}, {"id": "htks", "m": "m3", "core": true, "age": 5, "t": {"uk": "Голова-плечі навпаки", "ru": "Голова-плечи наоборот"}, "mat": {"uk": "нічого не потрібно", "ru": "ничего не нужно"}, "steps": {"uk": ["Розминка: «Торкнись голови», «Торкнись пальців ніг» — дитина виконує як сказано.", "Нове правило: робимо навпаки. Кажу «голова» — торкаєшся пальців ніг, кажу «пальці» — голови.", "Говоріть у різному темпі, інколи кілька разів одне й те саме.", "Коли вдається, додайте друге правило: «плечі» ↔ «коліна»."], "ru": ["Разминка: «Коснись головы», «Коснись пальцев ног» — ребёнок выполняет как сказано.", "Новое правило: делаем наоборот. Говорю «голова» — касаешься пальцев ног, говорю «пальцы» — головы.", "Говорите в разном темпе, иногда несколько раз одно и то же.", "Когда получается, добавьте второе правило: «плечи» ↔ «колени»."]}, "easy": {"uk": "Лише одна пара команд і повільний темп.", "ru": "Только одна пара команд и медленный темп."}, "hard": {"uk": "Дві пари навпаки, швидкий темп, команди міняються місцями посеред гри.", "ru": "Две пары наоборот, быстрый темп, команды меняются местами посреди игры."}, "why": {"uk": "Утримати правило в пам’яті й стримати звичну дію — це саморегуляція, яку потрібно школі.", "ru": "Удержать правило в памяти и сдержать привычное действие — это саморегуляция, которая нужна в школе."}, "pdf": null}, {"id": "playplan", "m": "m3", "core": true, "age": 5, "t": {"uk": "План гри", "ru": "План игры"}, "mat": {"uk": "аркуш, олівці", "ru": "лист бумаги, карандаши"}, "steps": {"uk": ["Перед сюжетною грою (лікарня, кухня, магазин) спитайте: «Ким ти будеш? Що робитимеш спочатку, а що потім?»", "Дитина малює план: себе в ролі й 1–2 дії. Ви підписуєте її словами.", "Граєтеся 10–15 хвилин. Якщо гра «розпливається», показуєте на план.", "Після гри: «Що вийшло за планом? Що змінилося?»"], "ru": ["Перед сюжетной игрой (больница, кухня, магазин) спросите: «Кем ты будешь? Что будешь делать сначала, а что потом?»", "Ребёнок рисует план: себя в роли и 1–2 действия. Вы подписываете его словами.", "Играете 10–15 минут. Если игра «расплывается», показываете на план.", "После игры: «Что получилось по плану? Что изменилось?»"]}, "easy": {"uk": "План усно, без малювання.", "ru": "План устно, без рисования."}, "hard": {"uk": "План на кількох учасників: хто що робить.", "ru": "План на нескольких участников: кто что делает."}, "why": {"uk": "Планування гри — центральний прийом програм розвитку саморегуляції (Tools of the Mind).", "ru": "Планирование игры — центральный приём программ развития саморегуляции (Tools of the Mind)."}, "pdf": null}, {"id": "freeze", "m": "m3", "core": false, "age": 5, "t": {"uk": "Замри — відомри", "ru": "Замри — отомри"}, "mat": {"uk": "музика", "ru": "музыка"}, "steps": {"uk": ["Вмикайте музику — дитина танцює. Пауза — дитина завмирає." function gotProfile(){ const st=LS.get(GS_STORE,null); if(!st||!st.sessions) return null;
  const all=Object.values(st.sessions).filter(s=>s&&s.subs&&Object.values(s.subs).some(x=>x&&x.done));
  if(!all.length) return null;
  const firsts=all.filter(s=>s.run!=="retest").sort((a,b)=>(b.saved||0)-(a.saved||0)), f=firsts[0]||all.sort((a,b)=>(b.saved||0)-(a.saved||0))[0];
  const retest=all.find(s=>s.run==="retest"&&s.retest_of===f.session);
  const areas={}; for(const [m,ids] of Object.entries(GOT_AREAS)){ let sc=0,n=0; ids.forEach(id=>{const x=f.subs[id]; if(x&&x.done&&x.n_items){sc+=x.score;n+=x.n_items;}}); if(n) areas[m]={sc,n,r:sc/n}; }
  if(!Object.keys(areas).length) return null;
  const sorted=Object.entries(areas).sort((a,b)=>a[1].r-b[1].r);
  let sugg=sorted.filter(([m,a])=>a.r<=0.6).slice(0,2).map(x=>x[0]); if(!sugg.length&&sorted[0][1].r<0.8) sugg=[sorted[0][0]];
  const end=Math.max(0,...Object.values(f.parts||{}).map(p=>p.end||0))||f.saved||Date.now();
  return {date:end,areas,sugg,retest:!!retest,retest_due:end+7*864e5,age_m:f.age_m,name:f.name||"",session:f.session}; }

/* ---------- план ---------- */
function rng(seed){let s=seed%2147483647;if(s<=0)s+=2147483646;return()=>(s=s*16807%2147483647)/2147483647;}
function shuffle(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function quotas(focus,week){ const q={m1:2,m2:2,m3:2,m4:1,m5:2,m6:1,m7:0};
  if(week>=3){ if(week%2) q.m4--; else q.m6--; q.m7=1; }                 /* з 4-го тижня — шкільне життя */
  const add=focus.length===1?2:focus.length===2?1:0;
  focus.forEach(f=>{ for(let k=0;k<add;k++){ const donor=Object.keys(q).filter(m=>!focus.includes(m)&&q[m]>(["m1","m2","m3","m5"].includes(m)?1:0)).sort((a,b)=>q[b]-q[a])[0]; if(donor){q[donor]--;q[f]++;} } });
  return q; }
function buildPlan(o){ const r=rng(o.seed), weeks=[], ptr={};
  const pool=(m,week)=>ACTS.filter(a=>a.m===m&&(a.age<=o.age||week>=4));
  const next=(m,week,used)=>{ const list=pool(m,week); const seq=[].concat(...list.map(a=>a.core?[a.id,a.id]:[a.id]));   /* ядро — двічі за цикл */
    for(let k=0;k<seq.length;k++){ const i=(ptr[m]=((ptr[m]||0)+1))%seq.length; const id=seq[i]; if(!used.has(id)) return id; } return seq[0]; };
  for(let w=0;w<o.weeks;w++){ const q=quotas(o.focus,w), slots=[]; Object.entries(q).forEach(([m,n])=>{for(let i=0;i<n;i++)slots.push(m);});
    let days=null;
    for(let t=0;t<200&&!days;t++){ const s=shuffle(slots,r), d=[]; let ok=true;
      for(let i=0;i<5;i++){ const a=s[2*i],b=s[2*i+1]; if(a===b){ok=false;break;} d.push([a,b]); } if(ok) days=d; }
    days=days||[0,1,2,3,4].map(i=>[slots[2*i],slots[2*i+1]]);
    const used=new Set(); weeks.push(days.map(pair=>pair.map(m=>{const id=next(m,w,used);used.add(id);return id;}))); }
  return weeks; }

function dayIndex(st,now){ now=now||new Date(); const s=pday(st.start); s.setHours(0,0,0,0); const n=new Date(now); n.setHours(0,0,0,0);
  if(n<s) return {before:true}; const wd=n.getDay(); let k=0; for(let d=new Date(s);d<n;d.setDate(d.getDate()+1)){ const x=d.getDay(); if(x!==0&&x!==6) k++; }
  if(wd===0||wd===6) return {weekend:true,k}; return {k}; }

  $("#bd").onclick=()=>{ const seed=Date.now()%100000+7, st={v:CFG.VERSION,created:Date.now(),name:$("#nm").value.trim().slice(0,30),age,weeks,focus:focus.slice(),
      start:$("#sd").value||today,seed,got:gp?{session:gp.session,date:gp.date,sugg:gp.sugg}:null,marks:{},log:[]};
    st.plan=buildPlan(st); saveState(st); screenToday(); }; }

function statusOf(st,k){ return (st.marks[k]||{}).s||""; }
function stIcon(s){ return s==="done"?"✅":s==="skip"?"⏸️":s==="ref"?"🙅":""; }
function actCard(st,id,k){ const a=byId[id], s=k?statusOf(st,k):"";
  return `<div class="card click ${s==="done"?"done":s?"skip":""}" data-id="${id}" ${k?`data-k="${k}"`:""}><div class="ic">${MODS[a.m].ic}</div>
    <div><div class="tt">${esc(a.t[lang])} ${a.core?`<span class="star" title="${u("core")}">★</span>`:""}</div><div class="mm">${MODS[a.m][lang]} · ${u("min")}</div></div><div class="st">${stIcon(s)}</div></div>`; }
function bindCards(back){ app.querySelectorAll(".card.click").forEach(c=>c.onclick=()=>screenAct(c.dataset.id,c.dataset.k||"",back)); }

function screenToday(){ const st=pidState(); if(!st) return screenSetup(); nav("today"); const di=dayIndex(st);
  let body="";
  if(di.before) body=`<div class="form"><p>${u("before")(fmt(pday(st.start)))}</p></div>`;
  else{ const k=di.k, w=Math.floor(k/5), d=k%5;
    if(w>=st.weeks) body=`<div class="form"><p>${u("finished")}</p><p><a href="${CFG.GOT_URL}">${u("got_link")}</a></p></div>`;
    else if(di.weekend) body=`<p class="sub">${u("weekN")(Math.min(w+1,st.weeks),st.weeks)}</p><div class="form"><p>${u("weekend")}</p></div>`;
    else body=`<p class="sub">${u("weekN")(w+1,st.weeks)} · ${u("dayN")(d)}</p><h2>${u("todo")}</h2>`+st.plan[w][d].map((id,i)=>actCard(st,id,slotKey(w,d,i))).join(""); }
  view(`<div style="display:flex;gap:12px;align-items:center"><div class="hero sm"><img src="${OWL}" alt=""></div><h1 style="text-align:left;font-size:24px">${esc(u("greet")(st.name))}</h1></div>${body}`,true);
  bindCards(screenToday); }

function screenAct(id,k,back){ const st=pidState(), a=byId[id], s=k?statusOf(st,k):"";
  const pdf=a.pdf?(PDF_READY.includes(a.pdf)?`<a class="pdfl" href="${CFG.PDF_DIR}${a.pdf}_${lang}.pdf" target="_blank">🖨️ ${u("pdfs")[a.pdf]}</a>`:`<span class="pdfl" style="color:#999">🖨️ ${u("pdfs")[a.pdf]} — ${u("soon")}</span>`):"";
  view(`<div class="act"><div class="mod">${MODS[a.m].ic} ${MODS[a.m][lang]}${a.core?` · <span class="star">★ ${u("core")}</span>`:""}</div><h2>${esc(a.t[lang])}</h2>
    <div class="mat"><b>${u("mat")}</b> ${esc(a.mat[lang])}</div>${pdf}
    <h3 style="margin:12px 0 0;color:#2b3a8c">${u("steps")}</h3><ol>${a.steps[lang].map(x=>`<li>${esc(x)}</li>`).join("")}</ol>
    <div class="var"><div><b>${u("easy")}</b>${esc(a.easy[lang])}</div><div><b>${u("hard")}</b>${esc(a.hard[lang])}</div></div>
    <div class="why"><b>${u("why")}</b> ${esc(a.why[lang])}</div>
    ${k?(s?`<p class="center" style="color:#5d6594">${stIcon(s)} ${u("st_"+s)}</p><div class="row"><button class="btn small sec" id="un">${u("undo")}</button></div>`
       :`<div class="row"><button class="btn ok" id="dn">${u("done")}</button><button class="btn small sec" id="nn">${u("notnow")}</button><button class="btn small sec" id="rf">${u("refuse")}</button></div>`):""}
  </div><div class="row"><button class="ghost" id="bk">${u("back")}</button></div>`,true);
  const mark=v=>{ const S2=pidState(); if(v) S2.marks[k]={s:v,t:Date.now(),id}; else delete S2.marks[k]; S2.log.push({k,id,s:v||"undo",t:Date.now()}); saveState(S2); back(); };
  if($("#dn")){ $("#dn").onclick=()=>mark("done"); $("#nn").onclick=()=>mark("skip"); $("#rf").onclick=()=>mark("ref"); }
  if($("#un")) $("#un").onclick=()=>mark("");
  $("#bk").onclick=back; }

function screenWeek(){ const st=pidState(); if(!st) return screenSetup(); nav("week"); const di=dayIndex(st), cw=di.before?0:Math.min(st.weeks-1,Math.floor((di.k||0)/5));
  view(`<h2>${u("week")}</h2>`+st.plan.map((wk,w)=>`<div class="wk${w===cw?" cur":""}" id="w${w}"><h4>${u("weekN")(w+1,st.weeks)}</h4>${wk.map((day,d)=>`<div class="d"><div class="dn">${u("dayN")(d)}</div><div>${day.map((id,i)=>{const k=slotKey(w,d,i);return `<div class="a" data-id="${id}" data-k="${k}">${stIcon(statusOf(st,k))} ${MODS[byId[id].m].ic} ${esc(byId[id].t[lang])}${byId[id].core?" ★":""}</div>`;}).join("")}</div></div>`).join("")}</div>`).join(""),true);
  app.querySelectorAll(".a").forEach(x=>x.onclick=()=>screenAct(x.dataset.id,x.dataset.k,screenWeek));
  const c=$("#w"+cw); if(c) c.scrollIntoView({block:"start"}); }

function screenAll(){ const st=pidState(); nav("all");
  view(`<h2>${u("catalog")}</h2><p class="sub">${u("catalog_p")}</p>`+Object.keys(MODS).map(m=>`<h2 style="font-size:18px;margin-top:16px">${MODS[m].ic} ${MODS[m][lang]}</h2>`+ACTS.filter(a=>a.m===m).map(a=>actCard(st||{marks:{}},a.id,"")).join("")).join(""),!!st);
  bindCards(screenAll); }

function screenProgress(){ const st=pidState(); if(!st) return screenSetup(); nav("prog"); const di=dayIndex(st);
  const upto=di.before?0:Math.min(st.weeks*5,(di.k||0)+(di.weekend?0:1)); let planned=0,done=0; const pm={};
  for(let x=0;x<upto;x++){ const w=Math.floor(x/5),d=x%5; st.plan[w][d].forEach((id,i)=>{ planned++; const m=byId[id].m; pm[m]=pm[m]||{p:0,d:0}; pm[m].p++; if(statusOf(st,slotKey(w,d,i))==="done"){done++;pm[m].d++;} }); }
  view(`<h2>${u("progress")}</h2><div class="form"><p><b>${u("prog_total")(done,planned)}</b></p><div class="bar"><i style="width:${planned?Math.round(done/planned*100):0}%"></i></div>
    <h3 style="margin-top:14px">${u("prog_mod")}</h3>${Object.keys(MODS).filter(m=>pm[m]).map(m=>`<div class="mrow"><div class="nm">${MODS[m].ic} ${MODS[m][lang]}</div><div class="bar"><i style="width:${Math.round(pm[m].d/pm[m].p*100)}%"></i></div><div>${pm[m].d}/${pm[m].p}</div></div>`).join("")}
    <p style="color:#5d6594">${u("prog_note")}</p></div>`,true); }

function screenPrint(){ const st=pidState(); nav("print");
  view(`<h2>${u("print_t")}</h2><p class="sub">${u("print_p")}</p>`+Object.keys(T.uk.pdfs).map(k=>PDF_READY.includes(k)
    ?`<a class="card click" style="text-decoration:none" href="${CFG.PDF_DIR}${k}_${lang}.pdf" target="_blank"><div class="ic">🖨️</div><div class="tt">${u("pdfs")[k]}</div></a>`
    :`<div class="card" style="opacity:.6"><div class="ic">🖨️</div><div><div class="tt">${u("pdfs")[k]}</div><div class="mm">${u("soon")}</div></div></div>`).join(""),!!st); }

function screenSettings(){ const st=pidState(); nav("settings");
  view(`${langBtns()}<h2>${u("set_t")}</h2><div class="form"><p>${u("privacy")}</p><button class="btn small sec" id="rs">${u("reset")}</button></div>
    <p class="muted">${u("about")}${CFG.VERSION}</p>`,!!st);
  bindLang(screenSettings); $("#rs").onclick=()=>{ if(confirm(u("reset_q"))){ localStorage.removeItem(KEY); screenStart(); } }; }

document.documentElement.lang=lang; document.title=T[lang].brand+" · "+T[lang].title;
window.PG={buildPlan,quotas,gotProfile,dayIndex,ACTS};
pidState()?screenToday():screenStart();
</script>
</body>
</html>
